<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>SSAR on phones</title>
  <style>
    body { margin: 0; padding: 20px; background: #dfe3e8; font: 14px system-ui, sans-serif; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
    figure { margin: 0; }
    iframe { display: block; border: 0; border-radius: 22px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); background: #fff; }
    figcaption { padding: 8px 4px; color: #555; }
  </style>
</head>
<body>
  <figure><iframe src="/" width="360" height="740" title="Small phone"></iframe><figcaption>360 wide, small Android</figcaption></figure>
  <figure><iframe src="/#beats" width="393" height="740" title="Phone"></iframe><figcaption>393 wide, crate</figcaption></figure>
  <figure><iframe src="/#remake" width="430" height="740" title="Large phone"></iframe><figcaption>430 wide, lower page</figcaption></figure>
</body>
</html>
